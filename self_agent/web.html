<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Test</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dd; --user: #2b5fd9; --user-text: #ffffff; --accent: #2b5fd9;
    --code: #f0f0ec; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #202020; --text: #ececea; --muted: #9a9a94;
      --border: #333331; --user: #3d6ee6; --user-text: #ffffff; --accent: #7aa2ff;
      --code: #2a2a28; --error: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .note { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  header label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  input, textarea, button { font: inherit; color: inherit; }
  header input {
    width: 140px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg);
  }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .msgs { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 90%; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .bot.error { color: var(--error); }
  .bot a { color: var(--accent); }
  .bot ul { margin: 4px 0; padding-left: 20px; }
  .bot p { margin: 4px 0; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details { margin-top: 6px; font-size: 13px; }
  details pre {
    background: var(--code); padding: 8px; border-radius: 6px; overflow-x: auto;
    white-space: pre-wrap; max-height: 260px; margin: 4px 0;
  }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  .empty button {
    margin: 4px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); cursor: pointer; font-size: 13px;
  }
  form {
    border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px;
    display: flex; gap: 8px; justify-content: center;
  }
  textarea {
    flex: 1; max-width: 740px; resize: none; padding: 8px 12px; height: 44px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  }
  form button {
    padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>Agent Test</h1>
  <span class="note">Không lưu lịch sử: mỗi tin nhắn được trả lời độc lập. Gõ <code>!morning</code> để xem bản tin sáng.</span>
  <label>Tên kênh giả lập <input id="channel" placeholder="vd: the-thao"></label>
</header>
<main><div class="msgs" id="msgs">
  <div class="empty" id="empty">
    Thử:<br>
    <button>có tin gì mới?</button>
    <button>3 giờ chiều mai ở Hà Nội có mưa không?</button>
    <button>liệt kê việc trong To Do</button>
    <button>!morning</button>
  </div>
</div></main>
<form id="form">
  <textarea id="text" placeholder="Nhập tin nhắn… (Enter để gửi, Shift+Enter xuống dòng)" autofocus></textarea>
  <button id="send">Gửi</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), text = $("text"), send = $("send");

function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Markdown tối giản giống Discord: **đậm**, *nghiêng*, link, gạch đầu dòng
function md(src) {
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  let html = "", inList = false;
  for (const line of src.split("\n")) {
    const m = line.match(/^\s*[-*•]\s+(.*)$/);
    if (m) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(m[1])}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

function add(cls, html) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  msgs.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function submit(value) {
  const t = value.trim();
  if (!t || send.disabled) return;
  add("user", esc(t));
  text.value = "";
  send.disabled = true;
  const pending = add("bot", '<span class="meta">Đang trả lời…</span>');
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: t, channel: $("channel").value }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const tools = data.trace.length
      ? `<details><summary>${data.trace.length} lượt gọi tool</summary>` +
        data.trace.map((c) =>
          `<pre>${esc(c.tool)}(${esc(JSON.stringify(c.args))})\n→ ${esc(c.result)}</pre>`).join("") +
        "</details>"
      : "";
    pending.innerHTML = md(data.answer) + tools + `<div class="meta">${data.seconds}s</div>`;
  } catch (e) {
    pending.classList.add("error");
    pending.textContent = "Lỗi: " + e.message;
  } finally {
    send.disabled = false;
    text.focus();
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); submit(text.value); });
text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(text.value); }
});
document.querySelectorAll(".empty button").forEach((b) => b.addEventListener("click", () => submit(b.textContent)));
</script>
</body>
</html>
